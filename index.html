<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мой Мессенджер</title>
<style>
:root {
  --bg: #e9edf0; --panel: #ffffff; --panel2: #f0f2f5; --border: #e1e5e9;
  --text: #111b21; --muted: #667781; --accent: #00a884; --accent-d: #008f70;
  --in: #ffffff; --out: #d9fdd3; --chat-bg: #efeae2; --link: #027eb5; --danger: #e5484d;
}
body.dark-theme {
  --bg: #0b141a; --panel: #111b21; --panel2: #202c33; --border: #222d34;
  --text: #e9edef; --muted: #8696a0; --in: #202c33; --out: #005c4b;
  --chat-bg: #0b141a; --link: #53bdeb;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--text); }

/* ---- Вход ---- */
#auth-container { display: flex; justify-content: center; align-items: center; height: 100%; padding: 16px;
  background: linear-gradient(135deg, #00a884 0%, #075e54 100%); }
#auth-box { background: var(--panel); padding: 32px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.25); width: 100%; max-width: 360px; }
#auth-box h2 { margin: 0 0 18px; text-align: center; }
#auth-box input { display: block; width: 100%; margin-bottom: 10px; padding: 12px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--panel2); }
#auth-box input:focus, .modal input:focus { outline: 2px solid var(--accent); }
.btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 600; }
.btn:hover { background: var(--accent-d); }
.btn.secondary { background: var(--panel2); color: var(--text); }
.btn:disabled { opacity: .6; cursor: default; }
.row { display: flex; gap: 8px; }
.row input { margin-bottom: 10px; }
.row .btn { width: auto; padding: 0 14px; margin-bottom: 10px; white-space: nowrap; }
#auth-box a { color: var(--accent); }

/* ---- Приложение ---- */
#chat-app { display: none; height: 100%; width: 100%; }
#sidebar { width: 340px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.me-bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--panel2); }
.me-bar .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { background: none; border: none; font-size: 1.25em; color: var(--muted); padding: 6px; border-radius: 8px; }
.icon-btn:hover { background: var(--border); }
#side-scroll { flex: 1; overflow-y: auto; }
.section { padding: 14px 16px 6px; font-size: .75em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center; }
.search { display: flex; gap: 6px; padding: 8px 12px; }
.search input { flex: 1; padding: 9px 12px; border: none; border-radius: 10px; background: var(--panel2); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { padding: 9px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
ul.list li:hover { background: var(--panel2); }
ul.list li.active { background: var(--panel2); }
ul.list li .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--panel2); display: flex; align-items: center;
  justify-content: center; font-weight: 700; color: var(--muted); flex-shrink: 0; position: relative; font-size: 1.1em; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.online::after { content: ""; position: absolute; right: 1px; bottom: 1px; width: 10px; height: 10px; background: var(--accent);
  border: 2px solid var(--panel); border-radius: 50%; }
.mini { border: none; border-radius: 6px; padding: 4px 8px; font-size: .75em; font-weight: 600; background: var(--panel2); color: var(--text); }
.mini.add { background: var(--accent); color: #fff; }
.mini.del { color: var(--danger); }
.badge { background: var(--accent); color: #fff; border-radius: 10px; min-width: 20px; padding: 1px 6px; text-align: center; font-size: .75em; }
.empty { padding: 6px 16px; color: var(--muted); font-size: .85em; }

#chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); min-width: 0; }
#chat-header { display: none; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel2); border-bottom: 1px solid var(--border); }
#chat-title { font-weight: 600; }
#typing { font-size: .78em; color: var(--accent); min-height: 1em; }
#back-btn { display: none; }
#messages { flex: 1; overflow-y: auto; padding: 16px; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.placeholder { margin: auto; color: var(--muted); text-align: center; }
.day { align-self: center; background: var(--panel2); color: var(--muted); font-size: .75em; padding: 3px 10px; border-radius: 8px; margin: 8px 0; }
.message-item { max-width: min(70%, 560px); padding: 7px 10px 5px; border-radius: 10px; background: var(--in);
  box-shadow: 0 1px 1px rgba(0,0,0,.12); align-self: flex-start; word-wrap: break-word; overflow-wrap: anywhere; position: relative; }
.message-item.my-message { background: var(--out); align-self: flex-end; }
.message-item .author { font-size: .78em; font-weight: 700; color: var(--accent); }
.message-item .body { white-space: pre-wrap; }
.message-item .meta { font-size: .68em; color: var(--muted); text-align: right; margin-top: 2px; }
.message-item a { color: var(--link); }
.msg-image { max-width: 260px; max-height: 300px; border-radius: 8px; margin-top: 4px; display: block; }
.msg-del { position: absolute; top: 2px; right: 4px; display: none; background: var(--panel2); border: none; border-radius: 6px;
  font-size: .7em; padding: 1px 5px; color: var(--muted); }
.my-message:hover .msg-del { display: block; }

#form { background: var(--panel2); padding: 10px; display: flex; align-items: center; gap: 8px; position: relative; }
#input { flex: 1; padding: 11px 16px; border: none; border-radius: 22px; background: var(--panel); }
#input:focus { outline: none; }
#send-button { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 1.1em; }
#send-button:disabled { background: var(--border); color: var(--muted); }
#file-label { cursor: pointer; font-size: 1.4em; color: var(--muted); }
#emoji-pop { display: none; position: absolute; bottom: 58px; left: 10px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 8px; width: 288px; box-shadow: 0 6px 24px rgba(0,0,0,.2); flex-wrap: wrap; gap: 2px; z-index: 5; }
#emoji-pop button { background: none; border: none; font-size: 1.4em; border-radius: 6px; padding: 3px; }
#emoji-pop button:hover { background: var(--panel2); }

/* ---- Модалки ---- */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
.modal-content { background: var(--panel); padding: 22px; border-radius: 14px; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px; }
.modal-content h3 { margin: 0 0 6px; text-align: center; }
.modal-content label { font-size: .85em; font-weight: 600; color: var(--muted); }
.modal-content input:not([type=checkbox]), .modal-content select { width: 100%; padding: 10px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--panel2); }
.check { display: flex; align-items: center; gap: 8px; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #202c33; color: #fff; padding: 10px 18px;
  border-radius: 10px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 2000; max-width: 90vw; }
#toast.show { opacity: 1; }

@media (max-width: 760px) {
  #sidebar { width: 100%; }
  #chat-area { display: none; }
  #chat-app.in-chat #sidebar { display: none; }
  #chat-app.in-chat #chat-area { display: flex; }
  #back-btn { display: block; }
  .message-item { max-width: 85%; }
}
</style>
</head>
<body>

<div id="auth-container">
  <div id="auth-box">
    <h2 id="auth-title">Вход</h2>
    <input id="auth-username" placeholder="Имя пользователя или почта" autocomplete="username">
    <div id="register-fields" style="display:none">
      <div class="row">
        <input id="auth-email" type="email" placeholder="E-mail" style="flex:1">
        <button type="button" class="btn" onclick="sendCode()" id="send-code-btn">Код</button>
      </div>
      <input id="auth-code" placeholder="6-значный код из письма" inputmode="numeric">
    </div>
    <input id="auth-password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" onclick="auth()" id="auth-btn">Войти</button>
    <p style="margin:14px 0 0;text-align:center;font-size:.9em"><a href="#" onclick="toggleAuth();return false" id="auth-toggle">Нет аккаунта? Создать</a></p>
  </div>
</div>

<div id="chat-app">
  <div id="sidebar">
    <div class="me-bar">
      <div class="avatar" id="me-avatar"></div>
      <div class="name" id="me-name"></div>
      <button class="icon-btn" onclick="openSettings()" title="Настройки">⚙️</button>
      <button class="icon-btn" onclick="logout()" title="Выйти">🚪</button>
    </div>
    <div id="side-scroll">
      <div class="section">Комнаты <button class="icon-btn" style="font-size:1em;padding:0 6px" onclick="openCreateRoomModal()" title="Новая группа">＋</button></div>
      <ul class="list" id="room-list"></ul>

      <div class="section">Контакты</div>
      <div class="search">
        <input id="search-email-input" placeholder="Найти по E-mail…" onkeydown="if(event.key==='Enter')searchUser()">
        <button class="mini add" onclick="searchUser()">🔍</button>
      </div>
      <ul class="list" id="contacts-list"></ul>

      <div class="section">Сейчас онлайн</div>
      <ul class="list" id="online-users-list"></ul>

      <div class="section">Заблокированные</div>
      <ul class="list" id="blocked-users-list"></ul>
    </div>
  </div>

  <div id="chat-area">
    <div id="chat-header">
      <button class="icon-btn" id="back-btn" onclick="leaveChat()">←</button>
      <div>
        <div id="chat-title"></div>
        <div id="typing"></div>
      </div>
    </div>
    <ul id="messages"><li class="placeholder">Выберите чат слева 💬</li></ul>

    <form id="form" onsubmit="event.preventDefault(); sendMessage();">
      <div id="emoji-pop"></div>
      <button type="button" class="icon-btn" id="emoji-btn" onclick="toggleEmoji()" title="Эмодзи">😊</button>
      <label for="file-input" id="file-label" title="Файл">📎</label>
      <input type="file" id="file-input" style="display:none">
      <input id="input" autocomplete="off" placeholder="Выберите чат…" disabled>
      <button id="send-button" disabled title="Отправить">➤</button>
    </form>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Новая группа</h3>
    <input id="new-room-name" placeholder="Название">
    <label>Участники онлайн:</label>
    <div id="modal-users-list" style="max-height:140px;overflow-y:auto"></div>
    <input id="new-room-id-input" placeholder="ID участников (через запятую), необязательно">
    <div class="row">
      <button class="btn" onclick="createRoom()">Создать</button>
      <button class="btn secondary" onclick="closeModal()">Отмена</button>
    </div>
  </div>
</div>

<div id="settings-modal" class="modal">
  <div class="modal-content">
    <h3>Настройки</h3>
    <label>Аватарка (эмодзи или URL картинки)</label>
    <input id="set-avatar" placeholder="🦊 или https://…">
    <label>Имя пользователя</label>
    <input id="set-username">
    <label>E-mail (для смены введите новый)</label>
    <div class="row">
      <input type="email" id="set-email" style="flex:1">
      <button class="btn" onclick="sendSettingsCode()" id="set-code-btn" style="margin-bottom:0">Код</button>
    </div>
    <input id="set-code" placeholder="Код из нового письма" style="display:none">
    <label>Тема</label>
    <select id="set-theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select>
    <label class="check"><input type="checkbox" id="set-notifications"> Звуковые уведомления</label>
    <div class="row" style="margin-top:8px">
      <button class="btn" onclick="saveSettings()">Сохранить</button>
      <button class="btn secondary" onclick="closeSettings()">Отмена</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let myName = '', isLogin = true;
let currentRoom = null, currentRecipient = null;
let allActiveUsers = [];
let blocked = [];
const unread = {};            // ключ чата -> число
let settings = { theme: 'light', notifications: true, avatar: '👤' };
let lastDay = '';

const $ = (id) => document.getElementById(id);
const chatApp = $('chat-app'), messages = $('messages'), input = $('input');

/* ---------- Утилиты (весь пользовательский текст идёт через textContent — без XSS) ---------- */
function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e[k] = v;
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => c != null && e.append(c));
  return e;
}
function safeUrl(u) { return typeof u === 'string' && u.startsWith('/uploads/') ? u : ''; }
function avatarEl(name, avatar, online) {
  const a = el('div', { class: 'avatar' + (online ? ' online' : '') });
  if (avatar && /^https?:\/\//.test(avatar)) a.append(el('img', { src: avatar, alt: '' }));
  else a.textContent = (avatar && avatar !== '👤') ? avatar : (name || '?')[0].toUpperCase();
  return a;
}
let toastTimer;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function beep() {
  if (settings.notifications === false) return;
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.08, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .25);
    o.start(); o.stop(c.currentTime + .25);
  } catch {}
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  return r.json();
}
const chatKey = () => currentRoom ? 'r:' + currentRoom : currentRecipient ? 'u:' + currentRecipient : null;

/* ---------- Авторизация ---------- */
function toggleAuth() {
  isLogin = !isLogin;
  $('auth-title').textContent = isLogin ? 'Вход' : 'Регистрация';
  $('auth-btn').textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
  $('auth-toggle').textContent = isLogin ? 'Нет аккаунта? Создать' : 'Уже есть аккаунт? Войти';
  $('auth-username').placeholder = isLogin ? 'Имя пользователя или почта' : 'Придумайте имя';
  $('register-fields').style.display = isLogin ? 'none' : 'block';
}
async function sendCode() {
  const email = $('auth-email').value.trim(), btn = $('send-code-btn');
  if (!email.includes('@')) return toast('Введите корректный E-mail');
  btn.disabled = true; btn.textContent = '…';
  try { toast((await post('/send-code', { email })).message); }
  catch { toast('Ошибка запроса кода'); }
  btn.disabled = false; btn.textContent = 'Код';
}
async function auth() {
  const username = $('auth-username').value.trim(), password = $('auth-password').value;
  const payload = isLogin ? { username, password }
    : { username, password, email: $('auth-email').value.trim(), code: $('auth-code').value.trim() };
  try {
    const data = await post(isLogin ? '/login' : '/register', payload);
    if (!data.success) return toast(data.message || 'Ошибка авторизации');
    if (!isLogin) { toast('Регистрация успешна! Теперь войдите.'); toggleAuth(); return; }
    startApp(data.username || username);
  } catch { toast('Нет связи с сервером'); }
}
async function logout() {
  await post('/logout');
  location.reload();
}
$('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') auth(); });

async function startApp(username) {
  myName = username;
  $('auth-container').style.display = 'none';
  chatApp.style.display = 'flex';
  const p = await post('/get-profile');
  if (p.success) applySettings(p.user);
  $('me-name').textContent = myName;
  connectSocket();
}

/* ---------- Socket ---------- */
function connectSocket() {
  socket = io();
  socket.on('connect_error', () => toast('Сессия недействительна, войдите заново'));
  socket.on('update all active users', u => allActiveUsers = u);

  socket.on('update contacts', (list) => {
    const ul = $('contacts-list'); ul.innerHTML = '';
    if (!list.length) ul.append(el('div', { class: 'empty', text: 'Пока пусто — добавьте кого-нибудь' }));
    list.forEach(u => {
      const badge = el('span', { class: 'badge', style: 'display:none', 'data-key': 'u:' + u.username });
      const li = el('li', { onclick: () => joinPM(u.username) },
        avatarEl(u.username, u.avatar, u.online),
        el('span', { class: 'label', text: u.username }), badge,
        el('button', { class: 'mini del', text: '✕', title: 'Удалить', onclick: (e) => { e.stopPropagation(); if (confirm(`Удалить ${u.username} из контактов?`)) socket.emit('remove contact', u.username); } }),
        el('button', { class: 'mini', text: '🚫', title: 'Заблокировать', onclick: (e) => { e.stopPropagation(); if (confirm(`Заблокировать ${u.username}?`)) socket.emit('block user', u.username); } })
      );
      ul.append(li);
    });
    renderBadges();
  });

  socket.on('update potential contacts', (list) => {
    const ul = $('online-users-list'); ul.innerHTML = '';
    if (!list.length) ul.append(el('div', { class: 'empty', text: 'Больше никого онлайн' }));
    list.filter(u => !blocked.includes(u.username)).forEach(u => {
      ul.append(el('li', {},
        avatarEl(u.username, u.avatar, true),
        el('span', { class: 'label', text: u.username }),
        el('button', { class: 'mini add', text: 'Добавить', onclick: (e) => { e.stopPropagation(); socket.emit('add contact', u.username); toast(`${u.username} добавлен в контакты`); } })
      ));
    });
  });

  socket.on('update blocked list', (list) => {
    blocked = list;
    const ul = $('blocked-users-list'); ul.innerHTML = '';
    if (!list.length) ul.append(el('div', { class: 'empty', text: 'Никого' }));
    list.forEach(n => ul.append(el('li', {},
      avatarEl(n), el('span', { class: 'label', text: n }),
      el('button', { class: 'mini', text: 'Разблок.', onclick: (e) => { e.stopPropagation(); socket.emit('unblock user', n); } }))));
  });

  socket.on('update room list', (rooms) => {
    const ul = $('room-list'); ul.innerHTML = '';
    rooms.forEach(r => {
      const badge = el('span', { class: 'badge', style: 'display:none', 'data-key': 'r:' + r.name });
      ul.append(el('li', { class: currentRoom === r.name ? 'active' : '', onclick: () => joinRoom(r.name) },
        el('div', { class: 'avatar', text: r.type === 'private' ? '🔒' : '#' }),
        el('span', { class: 'label', text: r.name }), badge));
    });
    renderBadges();
  });

  socket.on('load history', (history) => {
    messages.innerHTML = ''; lastDay = '';
    if (!history.length) messages.append(el('li', { class: 'placeholder', text: 'Сообщений пока нет. Напишите первым!' }));
    history.forEach(appendMessage);
    messages.scrollTop = messages.scrollHeight;
  });

  socket.on('chat message', (msg) => {
    const inRoom = msg.room && msg.room === currentRoom;
    const inPM = !msg.room && currentRecipient &&
      ((msg.user === currentRecipient && msg.recipient === myName) || (msg.user === myName && msg.recipient === currentRecipient));
    if (inRoom || inPM) {
      messages.querySelector('.placeholder')?.remove();
      appendMessage(msg);
    }
    if (msg.user !== myName && !(inRoom || inPM)) {
      const key = msg.room ? 'r:' + msg.room : 'u:' + msg.user;
      unread[key] = (unread[key] || 0) + 1; renderBadges();
    }
    if (msg.user !== myName && (!(inRoom || inPM) || document.hidden)) beep();
  });

  socket.on('message deleted', ({ id }) => document.querySelector(`[data-id="${CSS.escape(id)}"]`)?.remove());

  let typingTimer;
  socket.on('typing', (d) => {
    const here = (d.room && d.room === currentRoom) || (d.recipient && currentRecipient === d.user);
    if (!here) return;
    $('typing').textContent = `${d.user} печатает…`;
    clearTimeout(typingTimer); typingTimer = setTimeout(() => $('typing').textContent = '', 2000);
  });

  socket.on('search result', (d) => {
    if (!d.success) return toast(d.message);
    if (d.username === myName) return toast('Это ваша собственная почта :)');
    if (confirm(`Найден пользователь: ${d.username}\nДобавить в контакты?`)) {
      socket.emit('add contact', d.username); $('search-email-input').value = '';
    }
  });
  socket.on('error message', toast);
}

function renderBadges() {
  document.querySelectorAll('.badge[data-key]').forEach(b => {
    const n = unread[b.dataset.key] || 0;
    b.style.display = n ? '' : 'none'; b.textContent = n;
  });
}

/* ---------- Чаты ---------- */
function openChat(title) {
  messages.innerHTML = '';
  input.disabled = false; $('send-button').disabled = false;
  input.placeholder = 'Сообщение';
  $('chat-header').style.display = 'flex';
  $('chat-title').textContent = title; $('typing').textContent = '';
  chatApp.classList.add('in-chat');
  delete unread[chatKey()]; renderBadges();
  if (!matchMedia('(max-width:760px)').matches) input.focus();
}
function joinRoom(name) { currentRoom = name; currentRecipient = null; openChat('# ' + name); socket.emit('join room', name); }
function joinPM(name) { currentRecipient = name; currentRoom = null; openChat(name); socket.emit('join pm', name); }
function leaveChat() { chatApp.classList.remove('in-chat'); }

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  emitMessage({ text });
  input.value = '';
}
function emitMessage(extra) {
  if (currentRoom) socket.emit('chat message', { ...extra, room: currentRoom });
  else if (currentRecipient) socket.emit('private message', { ...extra, recipient: currentRecipient });
}
let lastTyping = 0;
input.addEventListener('input', () => {
  if (Date.now() - lastTyping < 1500) return;
  lastTyping = Date.now();
  socket.emit('typing', { room: currentRoom, recipient: currentRecipient });
});

function appendMessage(d) {
  const day = new Date(d.timestamp || Date.now()).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  if (day !== lastDay) { lastDay = day; messages.append(el('li', { class: 'day', text: day })); }

  const mine = d.user === myName;
  const li = el('li', { class: 'message-item' + (mine ? ' my-message' : ''), 'data-id': d.id || '' });
  if (!mine && d.room) li.append(el('div', { class: 'author', text: d.user }));
  if (d.text) li.append(el('div', { class: 'body', text: d.text }));
  const url = safeUrl(d.fileUrl);
  if (url) {
    if (d.fileType === 'image') li.append(el('a', { href: url, target: '_blank', rel: 'noopener' }, el('img', { src: url, class: 'msg-image', alt: '' })));
    else li.append(el('a', { href: url, download: d.fileName || 'file', text: '📄 ' + (d.fileName || 'файл') }));
  }
  li.append(el('div', { class: 'meta', text: d.time || '' }));
  if (mine && d.id) li.append(el('button', { class: 'msg-del', text: '🗑', title: 'Удалить', onclick: () => confirm('Удалить сообщение?') && socket.emit('delete message', { id: d.id }) }));
  messages.append(li);
  messages.scrollTop = messages.scrollHeight;
}

/* ---------- Файлы и эмодзи ---------- */
$('file-input').onchange = async (e) => {
  const file = e.target.files[0]; if (!file || !chatKey()) return;
  const fd = new FormData(); fd.append('file', file);
  try {
    const data = await (await fetch('/upload', { method: 'POST', body: fd })).json();
    if (data.success) emitMessage({ fileUrl: data.fileUrl, fileName: data.fileName, fileType: data.fileType });
    else toast(data.message || 'Не удалось загрузить');
  } catch { toast('Ошибка загрузки'); }
  e.target.value = '';
};
const EMOJIS = '😀 😂 🤣 😊 😍 😘 😎 🤔 😅 😭 😡 👍 👎 👏 🙏 🔥 ❤️ 💔 🎉 ✨ 💯 😴 🤝 👀'.split(' ');
const pop = $('emoji-pop');
EMOJIS.forEach(e => pop.append(el('button', { type: 'button', text: e, onclick: () => { input.value += e; input.focus(); } })));
function toggleEmoji() { pop.style.display = pop.style.display === 'flex' ? 'none' : 'flex'; }
document.addEventListener('click', (e) => { if (!e.target.closest('#emoji-pop, #emoji-btn')) pop.style.display = 'none'; });

/* ---------- Группы ---------- */
function openCreateRoomModal() {
  $('modal').style.display = 'flex';
  $('new-room-name').value = ''; $('new-room-id-input').value = '';
  const box = $('modal-users-list'); box.innerHTML = '';
  const others = allActiveUsers.filter(u => u.username !== myName);
  if (!others.length) box.append(el('span', { class: 'empty', text: 'Нет пользователей онлайн' }));
  others.forEach(u => box.append(el('label', { class: 'check', style: 'padding:3px 0' },
    el('input', { type: 'checkbox', value: u.username }), ' ' + u.username)));
}
function closeModal() { $('modal').style.display = 'none'; }
function createRoom() {
  const name = $('new-room-name').value.trim();
  if (!name) return toast('Введите название');
  const memberNames = [...$('modal-users-list').querySelectorAll('input:checked')].map(c => c.value);
  const memberIds = $('new-room-id-input').value.split(',').map(s => s.trim()).filter(Boolean);
  socket.emit('create room', { name, memberNames, memberIds });
  closeModal();
}

function searchUser() {
  const email = $('search-email-input').value.trim();
  if (email) socket.emit('search user by email', email);
}

/* ---------- Настройки ---------- */
async function openSettings() {
  const d = await post('/get-profile');
  if (!d.success) return toast('Ошибка загрузки профиля');
  $('set-avatar').value = d.user.avatar || '👤';
  $('set-username').value = d.user.username;
  $('set-email').value = d.user.email || '';
  $('set-theme').value = d.user.theme || 'light';
  $('set-notifications').checked = d.user.notifications !== false;
  $('settings-modal').style.display = 'flex';
}
function closeSettings() {
  $('settings-modal').style.display = 'none';
  $('set-code').style.display = 'none'; $('set-code').value = '';
}
async function sendSettingsCode() {
  const email = $('set-email').value.trim(), btn = $('set-code-btn');
  if (!email.includes('@')) return toast('Введите корректную почту');
  btn.disabled = true;
  try {
    const d = await post('/send-code', { email });
    toast(d.message);
    if (d.success) $('set-code').style.display = 'block';
  } catch { toast('Ошибка отправки'); }
  btn.disabled = false;
}
async function saveSettings() {
  try {
    const d = await post('/update-profile', {
      newUsername: $('set-username').value.trim(), avatar: $('set-avatar').value.trim(),
      newEmail: $('set-email').value.trim(), code: $('set-code').value.trim(),
      theme: $('set-theme').value, notifications: $('set-notifications').checked
    });
    toast(d.message);
    if (d.success) {
      const renamed = d.user.username !== myName;
      myName = d.user.username; applySettings(d.user); closeSettings();
      if (renamed) location.reload();   // чтобы сокет переподключился под новым именем
    }
  } catch { toast('Ошибка при сохранении'); }
}
function applySettings(user) {
  settings = user;
  document.body.classList.toggle('dark-theme', user.theme === 'dark');
  const a = $('me-avatar'); a.innerHTML = '';
  a.replaceWith(Object.assign(avatarEl(myName, user.avatar), { id: 'me-avatar' }));
  $('me-name').textContent = myName;
}

/* ---------- Автовход ---------- */
window.onload = async () => {
  try {
    const d = await (await fetch('/check-session')).json();
    if (d.success && d.username) startApp(d.username);
  } catch (e) { console.error(e); }
};
</script>
